<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MakeMyDemo.com — Motion Teaser</title>
<style>
  @font-face{
    font-family:'Inter';
    src:url('assets/Inter.ttf') format('truetype');
    font-weight:100 900;
    font-style:normal;
    font-display:block;
  }
  :root{
    --bg:#09090B;
    --fg:#FAFAFA;
    --accent:#DFE104;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1920px;height:1080px;background:var(--bg);overflow:hidden;}
  #root{
    position:relative;
    width:1920px;
    height:1080px;
    overflow:hidden;
    background:var(--bg);
    color:var(--fg);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:geometricPrecision;
  }
  #glow{
    position:absolute;
    left:560px;top:-260px;
    width:1500px;height:1500px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(223,225,4,0.085) 0%, rgba(223,225,4,0.03) 34%, rgba(223,225,4,0) 64%);
    pointer-events:none;
  }
  #vignette{
    position:absolute;inset:0;
    background:radial-gradient(120% 90% at 50% 46%, rgba(9,9,11,0) 42%, rgba(9,9,11,0.72) 100%);
    pointer-events:none;
  }

  .scene{position:absolute;inset:0;opacity:0;}
  .pad{
    position:absolute;
    left:120px;right:120px;top:96px;bottom:96px;
    display:flex;flex-direction:column;justify-content:center;
  }
  .pad.center{align-items:center;text-align:center;}

  .eyebrow{
    font-size:22px;
    font-weight:600;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:30px;
  }
  .headline{
    font-size:98px;
    line-height:1.03;
    font-weight:700;
    letter-spacing:-.035em;
    max-width:1180px;
  }

  .field{
    margin-top:60px;
    display:flex;
    align-items:center;
    gap:24px;
    width:820px;
    height:112px;
    padding:0 38px;
    border:2px solid rgba(250,250,250,0.16);
    border-radius:20px;
    background:rgba(250,250,250,0.028);
  }
  .globe{color:var(--accent);flex:0 0 auto;display:block;}
  .caret{
    width:3px;height:54px;border-radius:2px;
    background:var(--accent);
    opacity:0;
  }

  .specs{
    list-style:none;
    margin-top:52px;
    display:flex;
    flex-direction:column;
    gap:26px;
  }
  .spec{
    display:flex;
    align-items:center;
    gap:26px;
    font-size:42px;
    font-weight:500;
    letter-spacing:-.015em;
  }
  .spec .tick{
    width:13px;height:13px;
    border-radius:4px;
    background:var(--accent);
    flex:0 0 auto;
  }

  .pill{
    margin-top:48px;
    display:inline-flex;
    align-items:center;
    gap:18px;
    padding:24px 48px;
    border-radius:999px;
    background:var(--accent);
    color:#09090B;
    font-size:32px;
    font-weight:700;
    letter-spacing:-.01em;
  }
  .pill .arrow{display:block;}

  .wordmark{
    font-size:152px;
    font-weight:800;
    letter-spacing:-.045em;
    line-height:1;
  }
  .wordmark .tld{color:var(--accent);}
  .rule{
    margin-top:38px;
    width:520px;
    height:5px;
    border-radius:3px;
    background:var(--accent);
    transform-origin:50% 50%;
  }
  .tagline{
    margin-top:34px;
    font-size:30px;
    font-weight:500;
    letter-spacing:.02em;
    color:rgba(250,250,250,0.62);
  }
</style>
</head>
<body>
<div id="root"
     data-composition-id="main"
     data-start="0"
     data-width="1920"
     data-height="1080"
     data-fps="24"
     data-duration="8">

  <div id="glow"></div>
  <div id="vignette"></div>

  <section id="s1" class="scene" data-start="0" data-duration="2.5" data-track-index="0">
    <div class="pad">
      <p class="eyebrow">Step 01 — Input</p>
      <h1 class="headline">Paste a public product URL</h1>
      <div class="field">
        <svg class="globe" viewBox="0 0 24 24" width="36" height="36" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M3 12h18"></path>
          <path d="M12 3c3.2 4 3.2 14 0 18"></path>
          <path d="M12 3c-3.2 4-3.2 14 0 18"></path>
        </svg>
        <span class="caret"></span>
      </div>
    </div>
  </section>

  <section id="s2" class="scene" data-start="2.5" data-duration="2.5" data-track-index="1">
    <div class="pad">
      <p class="eyebrow">Step 02 — First cut</p>
      <h1 class="headline">Receive a video first cut</h1>
      <ul class="specs">
        <li class="spec"><span class="tick"></span><span>AI-written script</span></li>
        <li class="spec"><span class="tick"></span><span>Product visuals</span></li>
        <li class="spec"><span class="tick"></span><span>Music</span></li>
      </ul>
    </div>
  </section>

  <section id="s3" class="scene" data-start="5" data-duration="1.5" data-track-index="2">
    <div class="pad">
      <p class="eyebrow">Step 03 — Deliver</p>
      <h1 class="headline">Review and export MP4</h1>
      <div class="pill">
        <svg class="arrow" viewBox="0 0 24 24" width="30" height="30" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v12"></path>
          <path d="M6 11l6 6 6-6"></path>
          <path d="M5 20h14"></path>
        </svg>
        <span>Export MP4</span>
      </div>
    </div>
  </section>

  <section id="s4" class="scene" data-start="6.5" data-duration="1.5" data-track-index="3">
    <div class="pad center">
      <h1 class="wordmark">MakeMyDemo<span class="tld">.com</span></h1>
      <div class="rule"></div>
      <p class="tagline">URL in. First cut out.</p>
    </div>
  </section>
</div>

<script src="assets/gsap.min.js"></script>
<script>
(function () {
  var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

  tl.fromTo("#glow",
    { x: -150, y: -90, scale: 0.92 },
    { x: 150, y: 95, scale: 1.1, duration: 8, ease: "none" }, 0);

  tl.set("#s1", { opacity: 1 }, 0);
  tl.from("#s1 .eyebrow",   { y: 26, autoAlpha: 0, duration: 0.55 }, 0.15);
  tl.from("#s1 .headline",  { y: 46, autoAlpha: 0, duration: 0.70 }, 0.26);
  tl.from("#s1 .field",     { y: 30, autoAlpha: 0, duration: 0.60 }, 0.42);
  tl.from("#s1 .globe",     { scale: 0.55, autoAlpha: 0, duration: 0.50, ease: "back.out(2)" }, 0.60);
  tl.fromTo("#s1 .field",
    { borderColor: "rgba(250,250,250,0.16)" },
    { borderColor: "rgba(223,225,4,0.55)", duration: 0.45 }, 1.02);
  tl.to("#s1 .field", { borderColor: "rgba(250,250,250,0.16)", duration: 0.45 }, 1.52);
  tl.set("#s1 .caret", { opacity: 1 }, 0.92);
  tl.to("#s1 .caret", { opacity: 0, duration: 0.22, repeat: 3, yoyo: true, ease: "none" }, 0.96);
  tl.to("#s1", { opacity: 0, duration: 0.32, ease: "power2.in" }, 2.18);

  tl.fromTo("#s2", { opacity: 0 }, { opacity: 1, duration: 0.30, ease: "power2.out" }, 2.50);
  tl.from("#s2 .eyebrow",  { y: 26, autoAlpha: 0, duration: 0.50 }, 2.60);
  tl.from("#s2 .headline", { y: 46, autoAlpha: 0, duration: 0.65 }, 2.70);
  tl.from("#s2 .spec",     { y: 32, autoAlpha: 0, duration: 0.60, stagger: 0.14 }, 3.02);
  tl.to("#s2", { opacity: 0, duration: 0.32, ease: "power2.in" }, 4.68);

  tl.fromTo("#s3", { opacity: 0 }, { opacity: 1, duration: 0.28, ease: "power2.out" }, 5.00);
  tl.from("#s3 .eyebrow",  { y: 24, autoAlpha: 0, duration: 0.45 }, 5.08);
  tl.from("#s3 .headline", { y: 44, autoAlpha: 0, duration: 0.60 }, 5.16);
  tl.from("#s3 .pill",     { y: 30, scale: 0.94, autoAlpha: 0, duration: 0.55, ease: "back.out(1.6)" }, 5.42);
  tl.to("#s3", { opacity: 0, duration: 0.30, ease: "power2.in" }, 6.20);

  tl.fromTo("#s4", { opacity: 0 }, { opacity: 1, duration: 0.32, ease: "power2.out" }, 6.50);
  tl.from("#s4 .wordmark", { y: 44, autoAlpha: 0, duration: 0.72 }, 6.62);
  tl.fromTo("#s4 .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.72, ease: "power3.out" }, 6.90);
  tl.from("#s4 .tagline", { y: 20, autoAlpha: 0, duration: 0.50 }, 7.02);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  window.__renderReady = true;
})();
</script>
</body>
</html>
