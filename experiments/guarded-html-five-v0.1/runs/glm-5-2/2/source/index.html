<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MakeMyDemo.com — Motion Teaser</title>
<style>
@font-face{font-family:'Inter';src:url('assets/Inter.ttf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#09090B}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#09090B;color:#FAFAFA;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.eyebrow{font-size:24px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:#DFE104;margin-bottom:30px}
.headline{font-weight:600;letter-spacing:-.015em;line-height:1.12;color:#FAFAFA}
.accent{color:#DFE104}
.line{display:block}
.line-in{display:inline-block}
#s1 .headline{font-size:96px}
#s2 .headline{font-size:88px}
#s3 .headline{font-size:76px}
.urlbar{margin-top:66px;width:1040px;height:116px;border:2px solid rgba(250,250,250,.22);border-radius:58px;display:flex;align-items:center;gap:22px;padding:0 30px 0 52px;background:rgba(250,250,250,.03)}
.url-text{font-size:38px;font-weight:500;color:rgba(250,250,250,.85);letter-spacing:.01em;white-space:nowrap}
.caret{width:4px;height:52px;background:#DFE104;border-radius:2px;flex:none}
.paste-chip{margin-left:auto;background:#DFE104;color:#09090B;font-size:25px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:16px 32px;border-radius:40px;flex:none}
.rows{margin-top:66px;display:flex;flex-direction:column;align-items:flex-start;gap:36px}
.row{display:flex;align-items:center;gap:28px}
.row svg{width:44px;height:44px;flex:none}
.row span{font-size:40px;font-weight:500;color:rgba(250,250,250,.9);letter-spacing:.005em}
.editor{margin-top:60px;position:relative;width:1160px}
.track{display:flex;height:10px;border-radius:5px;overflow:hidden;background:rgba(250,250,250,.08)}
.seg{height:100%;flex:none}
.seg-a{width:42%;background:#DFE104}
.seg-b{width:33%;background:rgba(250,250,250,.38)}
.seg-c{width:25%;background:rgba(250,250,250,.16)}
.playhead{position:absolute;left:0;top:-30px;width:4px;height:70px;background:#DFE104;border-radius:2px}
.mp4-chip{margin-top:56px;background:#DFE104;color:#09090B;font-size:30px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:18px 46px;border-radius:16px}
.mark{width:116px;height:116px;border-radius:30px;background:#DFE104;display:flex;align-items:center;justify-content:center;margin-bottom:46px}
.mark svg{width:46px;height:46px}
.wordmark{font-size:104px;font-weight:700;letter-spacing:-.025em;line-height:1.05;color:#FAFAFA}
.tagline{margin-top:40px;font-size:38px;font-weight:400;color:rgba(250,250,250,.62);letter-spacing:.01em}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-fps="24" data-duration="8">

  <section id="s1" class="scene" data-start="0" data-duration="2.3" data-track-index="0">
    <div class="eyebrow" id="s1-eyebrow">01 &middot; Paste</div>
    <h1 class="headline">
      <span class="line"><span class="line-in">Paste a public</span></span>
      <span class="line"><span class="line-in">product <span class="accent">URL.</span></span></span>
    </h1>
    <div class="urlbar" id="urlbar">
      <span class="url-text" id="urltext">https://your-product.com</span>
      <span class="caret" id="caret"></span>
      <span class="paste-chip" id="pastechip">Paste</span>
    </div>
  </section>

  <section id="s2" class="scene" data-start="2.3" data-duration="2.4" data-track-index="0">
    <div class="eyebrow" id="s2-eyebrow">02 &middot; Receive</div>
    <h1 class="headline">
      <span class="line"><span class="line-in">Receive a video</span></span>
      <span class="line"><span class="line-in"><span class="accent">first cut.</span></span></span>
    </h1>
    <div class="rows">
      <div class="row" id="row1">
        <svg viewBox="0 0 44 44" fill="none" stroke="#DFE104" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="7" y="5" width="30" height="34" rx="5"/>
          <path d="M14 15h16M14 22h16M14 29h9"/>
        </svg>
        <span>AI-written script</span>
      </div>
      <div class="row" id="row2">
        <svg viewBox="0 0 44 44" fill="none" stroke="#DFE104" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="7" width="34" height="30" rx="5"/>
          <circle cx="14.5" cy="16.5" r="3.2"/>
          <path d="M9 31l8-9 6 6 5-5 7 8"/>
        </svg>
        <span>Product visuals</span>
      </div>
      <div class="row" id="row3">
        <svg viewBox="0 0 44 44" fill="none" stroke="#DFE104" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="14" cy="33" r="5"/>
          <circle cx="30" cy="30" r="5"/>
          <path d="M19 33V12l16-3v21"/>
        </svg>
        <span>Music</span>
      </div>
    </div>
  </section>

  <section id="s3" class="scene" data-start="4.7" data-duration="1.7" data-track-index="0">
    <div class="eyebrow" id="s3-eyebrow">03 &middot; Export</div>
    <h1 class="headline">
      <span class="line"><span class="line-in">Review and export <span class="accent">MP4.</span></span></span>
    </h1>
    <div class="editor" id="editor">
      <div class="track" id="track">
        <span class="seg seg-a"></span><span class="seg seg-b"></span><span class="seg seg-c"></span>
      </div>
      <div class="playhead" id="playhead"></div>
    </div>
    <div class="mp4-chip" id="mp4chip">MP4</div>
  </section>

  <section id="s4" class="scene" data-start="6.4" data-duration="1.6" data-track-index="0">
    <div class="mark" id="mark">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M19 15l16 9-16 9z" fill="#09090B"/></svg>
    </div>
    <h1 class="wordmark">
      <span class="line"><span class="line-in">MakeMyDemo<span class="accent">.com</span></span></span>
    </h1>
    <p class="tagline" id="tagline">From product URL to video first cut.</p>
  </section>

</div>
<script src="assets/gsap.min.js"></script>
<script>
(function(){
  window.__timelines = window.__timelines || {};
  function init(){
    gsap.set('#s1',{autoAlpha:1});
    gsap.set('#s2,#s3,#s4',{autoAlpha:0});
    gsap.set('.eyebrow',{autoAlpha:0,y:22});
    gsap.set('.line-in',{yPercent:70,autoAlpha:0});
    gsap.set('#urlbar',{autoAlpha:0,y:26});
    gsap.set('#urltext',{clipPath:'inset(0% 100% 0% 0%)'});
    gsap.set('#pastechip',{autoAlpha:0,scale:.8});
    gsap.set('.row',{autoAlpha:0,y:34});
    gsap.set('#editor',{autoAlpha:0,y:24});
    gsap.set('#track',{scaleX:0,transformOrigin:'0% 50%'});
    gsap.set('#playhead',{autoAlpha:0,x:0});
    gsap.set('#mp4chip',{autoAlpha:0,scale:.7});
    gsap.set('#mark',{autoAlpha:0,scale:.6});
    gsap.set('#tagline',{autoAlpha:0,y:20});

    var tl = gsap.timeline({paused:true,defaults:{ease:'power3.out'}});

    tl.to('#s1-eyebrow',{autoAlpha:1,y:0,duration:.4},.05)
      .to('#s1 .line-in',{yPercent:0,autoAlpha:1,duration:.5,stagger:.1},.15)
      .to('#urlbar',{autoAlpha:1,y:0,duration:.4},.7)
      .to('#urltext',{clipPath:'inset(0% 0% 0% 0%)',duration:.45,ease:'power2.inOut'},.95)
      .to('#caret',{opacity:0,duration:.3,repeat:3,yoyo:true,ease:'none'},1.0)
      .to('#pastechip',{autoAlpha:1,scale:1,duration:.3,ease:'back.out(2)'},1.35)
      .to('#s1',{autoAlpha:0,duration:.28,ease:'power2.in'},2.02)

      .set('#s2',{autoAlpha:1},2.3)
      .to('#s2-eyebrow',{autoAlpha:1,y:0,duration:.4},2.4)
      .to('#s2 .line-in',{yPercent:0,autoAlpha:1,duration:.5,stagger:.1},2.5)
      .to('#row1',{autoAlpha:1,y:0,duration:.45},3.05)
      .to('#row2',{autoAlpha:1,y:0,duration:.45},3.27)
      .to('#row3',{autoAlpha:1,y:0,duration:.45},3.49)
      .to('#s2',{autoAlpha:0,duration:.28,ease:'power2.in'},4.42)

      .set('#s3',{autoAlpha:1},4.7)
      .to('#s3-eyebrow',{autoAlpha:1,y:0,duration:.34},4.78)
      .to('#s3 .line-in',{yPercent:0,autoAlpha:1,duration:.44},4.88)
      .to('#editor',{autoAlpha:1,y:0,duration:.32},5.1)
      .to('#track',{scaleX:1,duration:.35,ease:'power2.out'},5.2)
      .to('#playhead',{autoAlpha:1,duration:.13},5.42)
      .to('#playhead',{x:1156,duration:.5,ease:'power1.inOut'},5.55)
      .to('#mp4chip',{autoAlpha:1,scale:1,duration:.25,ease:'back.out(2)'},5.95)
      .to('#s3',{autoAlpha:0,duration:.22,ease:'power2.in'},6.18)

      .set('#s4',{autoAlpha:1},6.4)
      .to('#mark',{autoAlpha:1,scale:1,duration:.4,ease:'back.out(1.8)'},6.55)
      .to('#s4 .line-in',{yPercent:0,autoAlpha:1,duration:.5},6.7)
      .to('#tagline',{autoAlpha:1,y:0,duration:.4},7.05)
      .to('#tagline',{autoAlpha:1,duration:.55},7.45);

    window.__timelines['main'] = tl;
    window.__renderReady = true;
  }
  var fr = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  fr.then(init);
})();
</script>
</body>
</html>
