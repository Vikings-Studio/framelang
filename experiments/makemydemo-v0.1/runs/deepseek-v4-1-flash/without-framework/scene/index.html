<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>MakeMyDemo.com</title>
<style>
  @font-face {
    font-family: 'Inter';
    src: url('assets/Inter.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #09090B;
  }

  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #09090B;
    color: #FAFAFA;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  section {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    box-sizing: border-box;
    padding: 96px 120px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 34px;
    background: #09090B;
  }

  .eyebrow {
    margin: 0;
    font-size: 34px;
    line-height: 1;
    font-weight: 600;
    letter-spacing: 0.44em;
    text-transform: uppercase;
    color: #DFE104;
  }

  .headline {
    margin: 0;
    max-width: 1560px;
    font-size: 120px;
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -0.025em;
    color: #FAFAFA;
  }

  .accent { color: #DFE104; }

  .rule {
    width: 220px;
    height: 10px;
    background: #DFE104;
    transform-origin: left center;
  }

  .rule-2 { background: #FAFAFA; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-fps="24" data-duration="8.000000">

  <section id="s1" data-start="0" data-duration="3.958333" data-track-index="0">
    <p class="eyebrow">MakeMyDemo.com</p>
    <div class="rule" id="rule1"></div>
    <h1 class="headline" style="opacity:0">Paste a product <span class="accent">URL</span>.<br>Get a video first cut.</h1>
  </section>

  <section id="s2" data-start="4.000000" data-duration="4.000000" data-track-index="1">
    <p class="eyebrow">Script &middot; Visuals &middot; Music</p>
    <div class="rule rule-2" id="rule2"></div>
    <h1 class="headline" style="opacity:0">Review the cut.<br>Export the <span class="accent">MP4</span>.</h1>
  </section>

</div>

<script src="assets/gsap.min.js"></script>
<script>
(function () {
  var tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  tl.fromTo('#s1 .eyebrow', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7 }, 0.0);
  tl.fromTo('#rule1', { scaleX: 0 }, { scaleX: 1, duration: 0.7 }, 0.12);
  tl.fromTo('#s1 .headline', { opacity: 0, y: 64 }, { opacity: 1, y: 0, duration: 0.95 }, 0.333333);

  tl.fromTo('#s2 .eyebrow', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7 }, 4.0);
  tl.fromTo('#rule2', { scaleX: 0 }, { scaleX: 1, duration: 0.7 }, 4.12);
  tl.fromTo('#s2 .headline', { opacity: 0, y: 64 }, { opacity: 1, y: 0, duration: 0.95 }, 4.333333);

  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = tl;
  window.__renderReady = true;
})();
</script>
</body>
</html>
