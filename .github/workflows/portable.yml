name: Portable pilot
on:
  push:
  pull_request:
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: runner.os != 'macOS'
      - run: brew install ffmpeg
        if: runner.os == 'macOS'
      - run: ffmpeg -version
      - run: npm ci
      - name: Install HyperFrames headless shell
        if: runner.os != 'Linux'
        run: node node_modules/hyperframes/bin/hyperframes.mjs browser ensure
      - run: npm test
      - run: node src/cli.mjs lint examples/makemydemo-editorial/program.json
      - run: npm run example:compile
      - run: npm run example:check
      - run: npm run example:render
        env:
          HYPERFRAMES_BROWSER_PATH: ${{ runner.os == 'Linux' && steps.chrome.outputs.chrome-path || '' }}
      - run: npm run cinematic:compile
      - run: npm run recipe:compile
      - run: npm run recipe:v2:compile
      - run: npm run cinematic:check
      - run: npm run recipe:check
      - run: npm run recipe:v2:check
      - run: npm run verify:unfit-rejection
        env:
          HYPERFRAMES_BROWSER_PATH: ${{ runner.os == 'Linux' && steps.chrome.outputs.chrome-path || '' }}
      - run: npm run cinematic:render
        env:
          HYPERFRAMES_BROWSER_PATH: ${{ runner.os == 'Linux' && steps.chrome.outputs.chrome-path || '' }}
      - run: npm run recipe:v2:render
        env:
          HYPERFRAMES_BROWSER_PATH: ${{ runner.os == 'Linux' && steps.chrome.outputs.chrome-path || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: out/type-reveal/
