name: Portable pilot
# Runs only when flagged, to save Actions minutes:
#   - pull request labelled `ci` (or `release`)
#   - manual: Actions -> Portable pilot -> Run workflow
# Plain pushes and unlabelled pull requests start no jobs.
# The macOS/Windows legs are the point of this portability smoke test, so the matrix is kept.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ ((github.event.action == 'labeled' && github.event.label.name != 'ci' && github.event.label.name != 'release') || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[release]') && !contains(github.event.head_commit.message, '[deploy]'))) && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[deploy]'))) ||
      (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release')) && (github.event.action != 'labeled' || github.event.label.name == 'ci' || github.event.label.name == 'release'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: runner.os != 'macOS'
      - run: brew install ffmpeg
        if: runner.os == 'macOS'
      - run: ffmpeg -version
      - run: npm ci
      - name: Install HyperFrames headless shell
        if: runner.os != 'Linux'
        run: node node_modules/hyperframes/bin/hyperframes.mjs browser ensure
      - run: npm test
      - run: node src/cli.mjs lint examples/makemydemo-editorial/program.json
      - run: npm run example:compile
      - run: npm run example:check
      - run: npm run example:render
        env:
          HYPERFRAMES_BROWSER_PATH: ${{ runner.os == 'Linux' && steps.chrome.outputs.chrome-path || '' }}
      - run: npm run cinematic:compile
      - run: npm run recipe:compile
      - run: npm run recipe:v2:compile
      - run: npm run creative:compile
      - run: npm run options:compile
      - run: npm run cinematic:check
      - run: npm run recipe:check
      - run: npm run recipe:v2:check
      - run: npm run creative:check
      - run: npm run options:check
      - run: npm run verify:line-fit
      - run: npm run verify:unfit-rejection
        env:
          HYPERFRAMES_BROWSER_PATH: ${{ runner.os == 'Linux' && steps.chrome.outputs.chrome-path || '' }}
      - run: npm run cinematic:render
        env:
          HYPERFRAMES_BROWSER_PATH: ${{ runner.os == 'Linux' && steps.chrome.outputs.chrome-path || '' }}
      - run: npm run recipe:v2:render
        env:
          HYPERFRAMES_BROWSER_PATH: ${{ runner.os == 'Linux' && steps.chrome.outputs.chrome-path || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: out/type-reveal/
