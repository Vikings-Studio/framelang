name: Portable pilot
on:
  push:
  pull_request:
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: runner.os != 'macOS'
      - run: brew install ffmpeg
        if: runner.os == 'macOS'
      - run: ffmpeg -version
      - name: Warm Windows Chrome executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${{ steps.chrome.outputs.chrome-path }}" --version'
      - run: npm ci
      - run: npm test
      - run: npm run example:compile
      - run: npm run example:check
      - run: npm run example:render
        env:
          HYPERFRAMES_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: out/type-reveal/
